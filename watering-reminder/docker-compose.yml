services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waterbot
      POSTGRES_PASSWORD: waterbot
      POSTGRES_DB: waterbot
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterbot -d waterbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://waterbot:waterbot@db:5432/waterbot
      RUN_MODE: polling
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dbdata:
